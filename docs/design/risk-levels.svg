<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">AgentFileOps risk levels</title><desc id="d">Five levels from read-only to high-impact operations.</desc><style>text{font-family:system-ui,sans-serif;fill:#0F1E37}.h{font-size:28px;font-weight:700}.l{font-size:20px;font-weight:700}.s{font-size:15px}</style><rect width="1000" height="560" rx="24" fill="#F4F7FA"/><text x="42" y="52" class="h">Risk classification</text><g transform="translate(42 82)"><rect width="916" height="72" rx="12" fill="#00C8FF"/><text x="24" y="31" class="l">L0 · Read-only</text><text x="24" y="55" class="s">list · stat · find · read · checksum · automatic</text></g><g transform="translate(42 166)"><rect width="916" height="72" rx="12" fill="#108040"/><text x="24" y="31" class="l" fill="white">L1 · Additive</text><text x="24" y="55" class="s" fill="white">mkdir · new upload · copy to new path · policy-dependent</text></g><g transform="translate(42 250)"><rect width="916" height="72" rx="12" fill="#FFB400"/><text x="24" y="31" class="l">L2 · Replacement</text><text x="24" y="55" class="s">overwrite · move · chmod · symlink · review recommended</text></g><g transform="translate(42 334)"><rect width="916" height="72" rx="12" fill="#FF8C42"/><text x="24" y="31" class="l">L3 · Destructive</text><text x="24" y="55" class="s">single delete · explicit approval</text></g><g transform="translate(42 418)"><rect width="916" height="72" rx="12" fill="#DC3545"/><text x="24" y="31" class="l" fill="white">L4 · High impact</text><text x="24" y="55" class="s" fill="white">recursive/bulk delete · sync with deletion · staged approval</text></g></svg>
