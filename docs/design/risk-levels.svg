<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">AgentFileOps risk levels</title>
<desc id="desc">Five levels from read-only to high-impact operations, with controls for each level.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#162033}.heading{font-size:28px;font-weight:750}.level{font-size:20px;font-weight:750}.detail{font-size:15px}.on-dark{fill:#FFFFFF}</style>
<rect width="1000" height="560" rx="28" fill="#F4F7FA"/>
<text x="42" y="54" class="heading">Risk classification is a control decision</text>
<g transform="translate(42 82)"><rect width="916" height="72" rx="12" fill="#00C8FF"/><text x="24" y="31" class="level">L0 · Read-only</text><text x="24" y="55" class="detail">list · stat · find · read · checksum · automatic</text></g>
<g transform="translate(42 166)"><rect width="916" height="72" rx="12" fill="#108040"/><text x="24" y="31" class="level on-dark">L1 · Additive</text><text x="24" y="55" class="detail on-dark">mkdir · new upload · copy to new path · policy-dependent</text></g>
<g transform="translate(42 250)"><rect width="916" height="72" rx="12" fill="#FFB400"/><text x="24" y="31" class="level">L2 · Replacement</text><text x="24" y="55" class="detail">overwrite · move · chmod · symlink · review recommended</text></g>
<g transform="translate(42 334)"><rect width="916" height="72" rx="12" fill="#FF8C42"/><text x="24" y="31" class="level">L3 · Destructive</text><text x="24" y="55" class="detail">single delete · explicit approval · target identity required</text></g>
<g transform="translate(42 418)"><rect width="916" height="72" rx="12" fill="#DC3545"/><text x="24" y="31" class="level on-dark">L4 · High impact</text><text x="24" y="55" class="detail on-dark">recursive/bulk delete · sync deletion · staged approval and fingerprint</text></g>
</svg>
