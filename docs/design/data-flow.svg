<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">AgentFileOps operation and evidence flow</title>
<desc id="desc">An operation descriptor is validated, resolved, executed, normalized into a result, and then recorded in an audit trail.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#F4F7FA}.node{font-size:21px;font-weight:750}.sub{font-size:14px;fill:#DDE5EC}.line{stroke:#00C8FF;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#00C8FF"/></marker></defs>
<rect width="1100" height="520" rx="28" fill="#0F1E37"/>
<g transform="translate(35 105)"><rect width="185" height="110" rx="14" fill="#162033" stroke="#00C8FF" stroke-width="3"/><text x="92" y="45" text-anchor="middle" class="node">Descriptor</text><text x="92" y="72" text-anchor="middle" class="sub">intent · target · policy</text></g>
<path d="M220 160h45" class="line"/>
<g transform="translate(265 105)"><rect width="185" height="110" rx="14" fill="#362B12" stroke="#FFB400" stroke-width="3"/><text x="92" y="45" text-anchor="middle" class="node">Validate</text><text x="92" y="72" text-anchor="middle" class="sub">schema · risk · capability</text></g>
<path d="M450 160h45" class="line"/>
<g transform="translate(495 105)"><rect width="185" height="110" rx="14" fill="#202C44" stroke="#6CA8FF" stroke-width="3"/><text x="92" y="45" text-anchor="middle" class="node">Resolve</text><text x="92" y="72" text-anchor="middle" class="sub">connection · path · strategy</text></g>
<path d="M680 160h45" class="line"/>
<g transform="translate(725 105)"><rect width="155" height="110" rx="14" fill="#102A22" stroke="#108040" stroke-width="3"/><text x="77" y="45" text-anchor="middle" class="node">Execute</text><text x="77" y="72" text-anchor="middle" class="sub">SSH / SFTP</text></g>
<path d="M880 160h45" class="line"/>
<g transform="translate(925 105)"><rect width="140" height="110" rx="14" fill="#26313D" stroke="#6C757D" stroke-width="3"/><text x="70" y="45" text-anchor="middle" class="node">Result</text><text x="70" y="72" text-anchor="middle" class="sub">state · evidence</text></g>
<path d="M995 215v130H550" class="line"/>
<g transform="translate(380 350)"><rect width="340" height="100" rx="14" fill="#162033" stroke="#00C8FF" stroke-width="3"/><text x="170" y="42" text-anchor="middle" class="node">Audit event</text><text x="170" y="70" text-anchor="middle" class="sub">actor · target · decision · result · time</text></g>
</svg>
