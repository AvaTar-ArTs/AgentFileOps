<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">AgentFileOps operation data flow</title><desc id="d">Descriptor validated, executed, returned as result, and recorded in an audit trail.</desc><style>text{font-family:system-ui,sans-serif;fill:#F4F7FA}.b{font-size:21px;font-weight:700}.s{font-size:14px;fill:#DDE5EC}.a{stroke:#00C8FF;stroke-width:4}</style><rect width="1000" height="420" rx="24" fill="#0F1E37"/><g transform="translate(40 90)"><rect width="205" height="100" rx="14" fill="#162033" stroke="#00C8FF" stroke-width="3"/><text x="102" y="43" text-anchor="middle" class="b">Descriptor</text><text x="102" y="68" text-anchor="middle" class="s">intent + target + policy</text></g><path d="M245 140h55" class="a"/><g transform="translate(300 90)"><rect width="205" height="100" rx="14" fill="#362B12" stroke="#FFB400" stroke-width="3"/><text x="102" y="43" text-anchor="middle" class="b">Validator</text><text x="102" y="68" text-anchor="middle" class="s">risk + path + capability</text></g><path d="M505 140h55" class="a"/><g transform="translate(560 90)"><rect width="180" height="100" rx="14" fill="#102A22" stroke="#108040" stroke-width="3"/><text x="90" y="43" text-anchor="middle" class="b">Executor</text><text x="90" y="68" text-anchor="middle" class="s">SSH / SFTP</text></g><path d="M740 140h55" class="a"/><g transform="translate(795 90)"><rect width="165" height="100" rx="14" fill="#26313D" stroke="#6C757D" stroke-width="3"/><text x="82" y="43" text-anchor="middle" class="b">Result</text><text x="82" y="68" text-anchor="middle" class="s">state + evidence</text></g><path d="M650 190v95H402" class="a"/><g transform="translate(250 285)"><rect width="305" height="80" rx="14" fill="#162033" stroke="#00C8FF" stroke-width="3"/><text x="152" y="34" text-anchor="middle" class="b">Audit trail</text><text x="152" y="58" text-anchor="middle" class="s">decision · actor · fingerprint · timestamp</text></g></svg>
