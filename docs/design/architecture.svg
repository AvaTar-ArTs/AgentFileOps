<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" role="img" aria-labelledby="t d"><title id="t">AgentFileOps architecture</title><desc id="d">Agent, protocol, safety engine, connection resolver, and remote filesystem.</desc><style>text{font-family:system-ui,sans-serif;fill:#F4F7FA}.x{font-size:24px;font-weight:700}.s{font-size:15px;fill:#DDE5EC}.b{stroke-width:3}</style><rect width="920" height="700" rx="24" fill="#0F1E37"/><text x="460" y="50" text-anchor="middle" class="x">AgentFileOps architecture</text><g transform="translate(160 80)"><rect width="600" height="90" rx="14" fill="#162033" stroke="#00C8FF" class="b"/><text x="300" y="40" text-anchor="middle" class="x">Agent / MCP client / operator</text><text x="300" y="67" text-anchor="middle" class="s">structured intent, never arbitrary shell</text></g><text x="460" y="210" text-anchor="middle" class="x">↓</text><g transform="translate(160 230)"><rect width="600" height="90" rx="14" fill="#162033" stroke="#00C8FF" class="b"/><text x="300" y="40" text-anchor="middle" class="x">AgentFileOps protocol</text><text x="300" y="67" text-anchor="middle" class="s">semantic operations and canonical schemas</text></g><text x="460" y="360" text-anchor="middle" class="x">↓</text><g transform="translate(160 380)"><rect width="600" height="90" rx="14" fill="#362B12" stroke="#FFB400" class="b"/><text x="300" y="40" text-anchor="middle" class="x">Safety and risk engine</text><text x="300" y="67" text-anchor="middle" class="s">preflight, policy, approvals, audit context</text></g><text x="460" y="510" text-anchor="middle" class="x">↓</text><g transform="translate(160 530)"><rect width="600" height="90" rx="14" fill="#102A22" stroke="#108040" class="b"/><text x="300" y="40" text-anchor="middle" class="x">SSH/SFTP → remote filesystem</text><text x="300" y="67" text-anchor="middle" class="s">VPS · NAS · hosting · deployment target</text></g></svg>
