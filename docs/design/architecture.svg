<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 900" role="img" aria-labelledby="title desc">
<title id="title">AgentFileOps canonical architecture</title>
<desc id="desc">An agent request passes through the protocol, safety policy, connection and path resolution, backend strategy, transport, and remote filesystem.</desc>
<style>
text{font-family:system-ui,sans-serif;fill:#F4F7FA}.title{font-size:25px;font-weight:750}.body{font-size:15px;fill:#DDE5EC}.arrow{stroke:#00C8FF;stroke-width:4}.box{stroke-width:3}
</style>
<rect width="920" height="900" rx="28" fill="#0F1E37"/>
<text x="460" y="52" text-anchor="middle" class="title">AgentFileOps canonical architecture</text>
<g transform="translate(130 76)"><rect width="660" height="86" rx="14" fill="#162033" stroke="#00C8FF" class="box"/><text x="330" y="37" text-anchor="middle" class="title">Agent / MCP client / operator</text><text x="330" y="64" text-anchor="middle" class="body">declares intent; never supplies an arbitrary shell command</text></g>
<path d="M460 162v30" class="arrow"/>
<g transform="translate(130 192)"><rect width="660" height="86" rx="14" fill="#162033" stroke="#00C8FF" class="box"/><text x="330" y="37" text-anchor="middle" class="title">AgentFileOps protocol</text><text x="330" y="64" text-anchor="middle" class="body">canonical schemas, operation, plan, result, and audit contracts</text></g>
<path d="M460 278v30" class="arrow"/>
<g transform="translate(130 308)"><rect width="660" height="86" rx="14" fill="#362B12" stroke="#FFB400" class="box"/><text x="330" y="37" text-anchor="middle" class="title">Risk and preflight policy</text><text x="330" y="64" text-anchor="middle" class="body">L0–L4 classification, approvals, fingerprints, and safety gates</text></g>
<path d="M460 394v30" class="arrow"/>
<g transform="translate(130 424)"><rect width="660" height="86" rx="14" fill="#202C44" stroke="#6CA8FF" class="box"/><text x="330" y="37" text-anchor="middle" class="title">Connection and path resolution</text><text x="330" y="64" text-anchor="middle" class="body">logical base, aliases, absolute mode, credential and host-key references</text></g>
<path d="M460 510v30" class="arrow"/>
<g transform="translate(130 540)"><rect width="660" height="86" rx="14" fill="#202C44" stroke="#6CA8FF" class="box"/><text x="330" y="37" text-anchor="middle" class="title">Backend strategy selection</text><text x="330" y="64" text-anchor="middle" class="body">portable SFTP baseline or constrained, capability-proven acceleration</text></g>
<path d="M460 626v30" class="arrow"/>
<g transform="translate(130 656)"><rect width="660" height="86" rx="14" fill="#102A22" stroke="#108040" class="box"/><text x="330" y="37" text-anchor="middle" class="title">SSH/SFTP transport</text><text x="330" y="64" text-anchor="middle" class="body">strict host-key verification, bounded I/O, semantic filesystem operations</text></g>
<path d="M460 742v30" class="arrow"/>
<g transform="translate(130 772)"><rect width="660" height="86" rx="14" fill="#26313D" stroke="#6C757D" class="box"/><text x="330" y="37" text-anchor="middle" class="title">Remote filesystem</text><text x="330" y="64" text-anchor="middle" class="body">VPS · NAS · hosting · deployment target</text></g>
</svg>
