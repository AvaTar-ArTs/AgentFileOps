[workspace]
members = [
  "crates/agent-file-ops-core",
  "crates/agent-file-ops-cli",
  "crates/agent-file-ops-ssh",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AvaTar-ArTs/AgentFileOps"
homepage = "https://github.com/AvaTar-ArTs/AgentFileOps"
description = "Safety-first remote filesystem operations for AI agents and MCP clients over SSH/SFTP without arbitrary shell access."
keywords = ["mcp", "ssh", "sftp", "filesystem", "ai-agents"]
categories = ["filesystem", "command-line-utilities", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "net", "io-util", "sync"] }
russh = "0.62"
russh-sftp = "2.3"
