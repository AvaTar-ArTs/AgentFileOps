name: AgentFileOps CLI Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package-cli:
    name: Package afo on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build zip and tar.gz packages
        run: python scripts/package_cli.py --output-dir dist
      - name: Upload CLI release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentfileops-cli-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
